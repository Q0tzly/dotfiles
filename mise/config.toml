# Core: always installed. Optional tools live in groups/ (see `mise-group list`).
[tools]
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
helix = "latest"
ripgrep = "latest"
starship = "latest"
zoxide = "latest"
# flp is built from source with cargo, so core needs rust.
rust = "latest"
"cargo:flp" = "latest"
