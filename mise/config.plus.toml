# Loaded on top of config.toml when MISE_ENV=plus.
[tools]
# Languages / runtimes
rust = "latest"
go = "latest"
node = "latest"
bun = "latest"
python = "latest"
uv = "latest"
wasm-tools = "latest"

# Rust tooling
cargo-binstall = "latest"
"cargo:auto-oss" = "latest"
"cargo:cargo-sweep" = "latest"
"cargo:flp" = "latest"
"cargo:furl-cli" = "latest"
"cargo:onefetch" = "latest"
"cargo:repom" = "latest"
"cargo:ripget" = "latest"
"cargo:veryl" = "latest"

# AI / agents
claude = "latest"
codex = "latest"
"github:rtk-ai/rtk" = "latest"

# Cloud / infra / web
wrangler = { version = "latest", allow_builds = ["esbuild", "sharp", "workerd"] }
"npm:cf" = "1.0.0-beta.12"
cloudflared = "latest"
hugo = "latest"
rclone = "latest"
colima = "latest"
docker-cli = "latest"
lima = "latest"

# Media
ffmpeg = "latest"

# Misc
"go:github.com/boyter/scc/v3" = "latest"
"go:github.com/Q0tzly/pstty/cmd/pst" = "latest"
