# Some probes run through mise shims (e.g. python3 --version for the
# python module), and a shim's config lookup can exceed starship's
# default 500ms command timeout, which prints a warning on the prompt.
command_timeout = 2000

[env_var.PSTTY_SESSION]
variable = "PSTTY_SESSION"
format = "[pstty:$env_value]($style) "
style = "bold yellow"
